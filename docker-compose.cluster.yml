# ---------------------------------------------------------------------------
#  Cluster override: adds a real Apache Kafka broker (KRaft) and a real HDFS
#  cluster (NameNode + DataNode).  Use together with docker-compose.yml:
#
#      docker compose -f docker-compose.yml -f docker-compose.cluster.yml up --build
#
#  Kafka UI-less check :  docker compose exec kafka /opt/kafka/bin/kafka-topics.sh \
#                           --bootstrap-server kafka:9092 --list
#  HDFS NameNode UI    :  http://localhost:9870   (Utilities -> Browse the file system)
# ---------------------------------------------------------------------------
x-hadoop-env: &hadoop-env
  CORE-SITE.XML_fs.default.name: "hdfs://namenode"
  CORE-SITE.XML_fs.defaultFS: "hdfs://namenode"
  HDFS-SITE.XML_dfs.namenode.rpc-address: "namenode:8020"
  HDFS-SITE.XML_dfs.replication: "1"
  HDFS-SITE.XML_dfs.permissions.enabled: "false"
  HDFS-SITE.XML_dfs.webhdfs.enabled: "true"

services:
  app:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      WEBHDFS_URL: "http://namenode:9870"
      HDFS_USER: "hadoop"
    depends_on:
      - kafka
      - namenode
      - datanode

  kafka:
    image: apache/kafka:3.7.0
    container_name: bda-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  namenode:
    image: apache/hadoop:3.3.6
    container_name: bda-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
    environment:
      <<: *hadoop-env
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name"

  datanode:
    image: apache/hadoop:3.3.6
    container_name: bda-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    environment:
      <<: *hadoop-env
    depends_on:
      - namenode
